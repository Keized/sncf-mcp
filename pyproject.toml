[project]
name = "sncf-mcp"
version = "0.1.0"
description = "MCP server for SNCF train schedules, delays and disruptions (SNCF API)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27"]

[project.scripts]
sncf-mcp = "sncf_mcp.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sncf_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p anyio"
